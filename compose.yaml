name: course-registration
x-backend: &backend
  build: ./backend
  environment: &backend-env
    DATABASE_URL: postgresql+psycopg://course_app@db:5432/courses
    DATABASE_PASSWORD: ${APP_DB_PASSWORD:-course_app}
    PUBLIC_DATABASE_URL: postgresql+psycopg://course_public@db:5432/courses
    PUBLIC_DATABASE_PASSWORD: ${PUBLIC_DB_PASSWORD:-course_public}
    APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
    APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:-}
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
    PUBLIC_INITIAL_TERM_ID: ${PUBLIC_INITIAL_TERM_ID-8abc15dd-c1b8-53ed-a570-ae723e17a762}
    INITIAL_START_AT: ${INITIAL_START_AT:-}
    INITIAL_END_AT: ${INITIAL_END_AT:-}
    GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
    GEMINI_AUDIO_MODEL: ${GEMINI_AUDIO_MODEL:-gemini-3.5-flash-lite}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    CHAT_STUB: ${CHAT_STUB:-false}
    SMTP_HOST: ${SMTP_HOST:-mailpit}
    SMTP_PORT: ${SMTP_PORT:-1025}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SMTP_FROM: ${SMTP_FROM:-courses@example.test}
    SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
  depends_on:
    migrate:
      condition: service_completed_successfully
services:
  db:
    image: postgres:16.15-bookworm
    environment:
      POSTGRES_DB: courses
      POSTGRES_USER: course_migrator
      POSTGRES_PASSWORD: ${MIGRATOR_DB_PASSWORD:-course_migrator}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-course_app}
      PUBLIC_DB_PASSWORD: ${PUBLIC_DB_PASSWORD:-course_public}
    volumes:
      - course_db:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/10-users.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "course_migrator", "-d", "courses"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    <<: *backend
    environment:
      DATABASE_URL: postgresql+psycopg://course_migrator@db:5432/courses
      DATABASE_PASSWORD: ${MIGRATOR_DB_PASSWORD:-course_migrator}
      PUBLIC_DATABASE_URL: postgresql+psycopg://course_public@db:5432/courses
      PUBLIC_DATABASE_PASSWORD: ${PUBLIC_DB_PASSWORD:-course_public}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  api:
    <<: *backend
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20
  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
  https:
    image: nginx:1.28.0-alpine
    profiles: ["https"]
    ports:
      - "${HTTPS_PORT:-8443}:443"
    depends_on:
      frontend:
        condition: service_started
    volumes:
      - type: bind
        source: ./frontend/nginx.https.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.tls/server.crt
        target: /etc/nginx/tls/server.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.tls/server.key
        target: /etc/nginx/tls/server.key
        read_only: true
        bind:
          create_host_path: false
  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
  mailpit:
    image: axllent/mailpit:v1.27.8
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
volumes:
  course_db:
